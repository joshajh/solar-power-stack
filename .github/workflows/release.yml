name: release

# Run on a version tag such as v0.1.0 or v0.1.0-test.
on:
  push:
    tags: ['v*']

jobs:
  # Build the image with the same workflow that you can also run by hand.
  image:
    uses: ./.github/workflows/image.yml

  publish:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write   # lets the job create the GitHub Release
    env:
      # Josh adds these as repository secrets. The B2 step skips when they are missing.
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: solar-image
          path: out
      - name: Write os-list.json
        run: |
          img=$(ls out/*.img.xz)
          base="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          cp image/icon.png out/icon.png
          image/make-os-list.sh "$img" "${{ github.ref_name }}" "$base" "$base/icon.png" > out/os-list.json
      - name: Create the GitHub Release
        run: |
          # A tag with a dash (v0.1.0-test, v0.2.0-rc1) is a pre-release.
          flag=""
          case "${{ github.ref_name }}" in *-*) flag="--prerelease" ;; esac
          gh release create "${{ github.ref_name }}" $flag --generate-notes \
            --title "${{ github.ref_name }}" \
            --notes "Flash this image with Raspberry Pi Imager. See docs/flashing.md." \
            out/*.img.xz out/*.sha256 out/os-list.json out/icon.png
      - name: Mirror to Backblaze B2
        run: |
          if [ -z "$B2_KEY_ID" ] || [ -z "$B2_APPLICATION_KEY" ] || [ -z "$B2_BUCKET" ] || [ -z "$B2_ENDPOINT" ]; then
            echo "::warning::B2 secrets are missing. Skipping the B2 mirror."
            exit 0
          fi
          # B2 speaks the S3 protocol, so the aws CLI on the runner uploads the files.
          export AWS_ACCESS_KEY_ID="$B2_KEY_ID" AWS_SECRET_ACCESS_KEY="$B2_APPLICATION_KEY"
          export AWS_DEFAULT_REGION=us-east-1
          aws s3 cp out/ "s3://$B2_BUCKET/releases/${{ github.ref_name }}/" \
            --recursive --endpoint-url "$B2_ENDPOINT"

name: shellcheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # shellcheck comes preinstalled on GitHub's Ubuntu runners.
      # The step passes when no shell scripts exist yet.
      - name: Run shellcheck on install/, image/ and setup/
        run: |
          # solar-setup has no .sh ending, so name it.
          files=$(find install image setup -type f \( -name '*.sh' -o -name '*.bash' -o -name solar-setup \) 2>/dev/null)
          if [ -z "$files" ]; then echo "No shell scripts yet."; exit 0; fi
          # shellcheck disable=SC2086
          shellcheck $files

  oslist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test the Imager repository file generator
        run: tests/test-oslist.sh

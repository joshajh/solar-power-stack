name: shellcheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck comes preinstalled on GitHub's Ubuntu runners.
      # The step passes when no shell scripts exist yet.
      - name: Run shellcheck on install/ and image/
        run: |
          files=$(find install image -type f \( -name '*.sh' -o -name '*.bash' \) 2>/dev/null)
          if [ -z "$files" ]; then echo "No shell scripts yet."; exit 0; fi
          # shellcheck disable=SC2086
          shellcheck $files
